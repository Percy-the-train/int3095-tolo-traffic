name: collect-traffic

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: traffic-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Poll traffic feeds
        run: python collector/collect_traffic.py --once
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: traffic-${{ github.run_number }}
          path: |
            data/traffic/detector_readings.csv
            data/traffic/segment_readings.csv
          retention-days: 90
          compression-level: 6
      - name: Schedule next run
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          sleep 300
          gh api --method POST \
            /repos/${{ github.repository }}/actions/workflows/collect.yml/dispatches \
            -f ref=${{ github.ref_name }} || true
