name: collect-traffic

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Poll traffic feeds
        run: python collector/collect_traffic.py --once
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: traffic-${{ github.run_number }}
          path: |
            collector/data/detector_readings.csv
            collector/data/segment_readings.csv
          retention-days: 90
          compression-level: 6
